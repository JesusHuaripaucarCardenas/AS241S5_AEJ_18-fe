<div class="preview-overlay" *ngIf="preview" (click)="onOverlayClick($event)">
  <div class="preview-box" [class.preview-box--id]="preview.type === 'id'">

    <div class="preview-header">
      <span class="preview-label">{{ preview.label }}</span>
      <div class="preview-header__actions">
        <button class="preview-action" title="Copiar" (click)="copyToClipboard()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copiar
        </button>
        <button class="preview-close" (click)="close.emit()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="preview-content" [class.preview-content--mono]="preview.type === 'id'">
      {{ preview.value }}
    </div>

    <div class="preview-footer">
      <span class="preview-chars">{{ preview.value.length }} caracteres</span>
    </div>

  </div>
</div>
